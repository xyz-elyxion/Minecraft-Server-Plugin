# ---------------------------------------------------------------------------
# SpeedrunAI - a bot that runs the early-game Any% route on your server.
#
# The runner spawns at the world spawn and plays the route on its own:
#
#   wood -> crafting table + wooden pickaxe -> dig down collecting cobblestone
#        -> stone pickaxe -> iron ore -> furnace -> smelted iron -> iron pickaxe
#
# Every milestone is a split on the timer. Nothing here is scripted location by
# location: the bot searches the terrain around it for whatever the next step
# needs, so it works on any normal (non-superflat) world.
# ---------------------------------------------------------------------------

run:
  # World the run happens in. Must exist; a normal terrain world is expected.
  world: world
  # Name shown above the runner.
  name: Runner
  # Show the live timer and split count to everyone online.
  boss-bar: true

  # Blocks moved per step, and how many ticks pass between steps.
  # 0.35 blocks every 2 ticks is roughly a jog.
  speed: 0.35
  step-ticks: 2
  # Ticks spent breaking one block. 10 ticks = half a second.
  break-ticks: 10
  # How far (in blocks, horizontally) the runner looks for trees, stone and ore.
  search-radius: 24
  # Dig down to this Y before searching for iron. Iron is common around y=40.
  dig-to-y: 40
  # Depth for the diamond leg. Diamonds are common below y=-50.
  diamond-y: -54

  # Resources the route needs. 4 logs is enough for a table, a pickaxe, sticks
  # and furnace fuel with room to spare.
  logs: 4
  iron: 3
  diamonds: 3
  # Obsidian for the portal frame; a ruined portal has enough.
  obsidian: 10
  # One rod per blaze killed, two eyes per rod.
  blaze-rods: 12
  pearls: 12

  # How far (in blocks) to look for a ruined portal, fortress or stronghold.
  locate-radius: 4000
  # Distance per travel step. Long distance travel is done in stepped teleports
  # rather than real pathing, which is the one travel shortcut in this plugin.
  travel-step: 32

messages:
  prefix: "<dark_gray>[<red>Speedrun<dark_gray>]</dark_gray> "
  started: "<green>The runner is off - timer started.</green>"
  already-running: "<red>A run is already going. Use /speedrun stop first.</red>"
  not-running: "<red>No run is going.</red>"
  stopped: "<gray>Run stopped.</gray>"
  no-world: "<red>Could not find the run world. Check run.world in config.yml.</red>"
  reloaded: "<green>Configuration reloaded.</green>"
  jumped: "<gray>Jumped the runner to phase <white><phase></white>.</gray>"
  no-such-phase: "<red>No such phase: <white><phase></white>.</red>"
  split: "<yellow><split></yellow> <gray>-</gray> <white><time></white>"
  finished: "<gold>Run finished in <white><time></white>!</gold>"
  status-running: "<gray>Running: <white><time></white></gray>"
  status-finished: "<gray>Finished: <white><time></white></gray>"
  status-line: "<gray>  <name>: <white><time></white></gray>"
  status-none: "<gray>No splits yet.</gray>"
  no-permission: "<red>You do not have permission to do that.</red>"
  usage: "<yellow>Usage: <white>/speedrun <start|stop|status|jump <phase>|reload></white></yellow>"
