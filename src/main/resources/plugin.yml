name: SpeedrunAI
version: '${version}'
main: dev.speedrun.SpeedrunPlugin
api-version: '26.3'
description: An AI runner that speedruns Minecraft on your server - wood, tools, digging, iron, furnace, iron pickaxe, against a live timer.
author: SpeedrunAI

commands:
  speedrun:
    description: Start, stop or inspect the speedrun.
    usage: /speedrun <start|stop|status|reload>
    aliases: [sr]

permissions:
  speedrun.use:
    description: Allows starting, stopping and inspecting the speedrun.
    default: op
