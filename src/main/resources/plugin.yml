name: CrackedAuth
version: '${version}'
main: dev.crackedauth.CrackedAuthPlugin
api-version: '26.3'
description: Password logins for offline-mode servers, plus a self-building Bedwars arena.
author: CrackedAuth

commands:
  register:
    description: Create an account on this server.
    usage: /register <password> <confirm-password>
    aliases: [reg]
  login:
    description: Log in with your password.
    usage: /login <password>
    aliases: [l]
  logout:
    description: Log out and lock your session again.
    usage: /logout
  changepassword:
    description: Change your account password.
    usage: /changepassword <current-password> <new-password>
    aliases: [cpw]
  authadmin:
    description: Manage CrackedAuth accounts.
    usage: /authadmin <unregister|forcelogin|setpassword|info|update|reload>
    aliases: [ca]
  bedwars:
    description: Join, leave or administer Bedwars.
    usage: /bedwars <join|leave|shop|ai|start|reset|reload>
    aliases: [bw]

permissions:
  crackedauth.use:
    description: Allows using /register, /login, /logout and /changepassword.
    default: true
  crackedauth.admin:
    description: Allows using /authadmin.
    default: op
  bedwars.play:
    description: Allows joining Bedwars games.
    default: true
  bedwars.admin:
    description: Allows starting, resetting and reloading the Bedwars arena.
    default: op
