name: Bedwars
version: '${version}'
main: dev.bedwars.BedwarsPlugin
api-version: '26.3'
description: Compact two-team Bedwars with generators, a shop, beds and respawns.
author: CrackedAuth

commands:
  bedwars:
    description: Join, leave or administer Bedwars.
    usage: /bedwars <join|leave|shop|start|reset|reload>
    aliases: [bw]

permissions:
  bedwars.play:
    description: Allows joining Bedwars games.
    default: true
  bedwars.admin:
    description: Allows starting, resetting and reloading the arena.
    default: op
