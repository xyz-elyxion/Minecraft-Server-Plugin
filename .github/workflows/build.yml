name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Write build summary
        run: |
          set -euo pipefail
          jar=$(ls build/libs/CrackedAuth-*.jar)
          api_version=$(unzip -p "$jar" plugin.yml | grep api-version)
          {
            echo "### CrackedAuth build"
            echo ""
            echo "| File | Size | API version |"
            echo "| --- | --- | --- |"
            echo "| $(basename "$jar") | $(du -h "$jar" | cut -f1) | ${api_version} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: CrackedAuth
          path: build/libs/CrackedAuth-*.jar
          if-no-files-found: error
          retention-days: 90
