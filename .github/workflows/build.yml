name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Write build summary
        run: |
          set -euo pipefail
          jar=$(ls build/libs/CrackedAuth-*.jar)
          api_version=$(unzip -p "$jar" plugin.yml | grep api-version)
          {
            echo "### CrackedAuth build"
            echo ""
            echo "| File | Size | API version |"
            echo "| --- | --- | --- |"
            echo "| $(basename "$jar") | $(du -h "$jar" | cut -f1) | ${api_version} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifacts are always handed out as a zip, so the built jar is attached to
      # a release instead: pushes to main refresh the "latest" release, and a
      # v* tag produces its own release. Both expose the plain .jar download.
      - name: Publish the .jar as a release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar=$(ls build/libs/CrackedAuth-*.jar)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release="${GITHUB_REF_NAME}"
            if ! gh release view "$release" >/dev/null 2>&1; then
              gh release create "$release" \
                --title "CrackedAuth ${release}" \
                --notes "Built from ${GITHUB_SHA}." \
                --target "${GITHUB_SHA}"
            fi
          else
            release="latest"
            if ! gh release view "$release" >/dev/null 2>&1; then
              gh release create "$release" \
                --title "Latest build" \
                --notes "Automatic build of every push to ${GITHUB_REF_NAME}."
            else
              # The in-plugin updater resolves /releases/latest, which skips pre-releases.
              gh release edit "$release" --prerelease=false
            fi
          fi
          gh release upload "$release" "$jar" --clobber
          echo "attached $(basename "$jar") to release ${release}" >> "$GITHUB_STEP_SUMMARY"
